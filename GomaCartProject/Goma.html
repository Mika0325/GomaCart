<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GomaCart</title>
    <link rel="stylesheet" href="Cart.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <header>🌸 GomaCart</header>

    <main>
        <section id="shopping" class="tab-content active">
            <h2>買い物リスト</h2>
            <input id="itemName" type="text" placeholder="アイテム名">
            <input id="itemQty" type="number" placeholder="数量" min="0" step="1">
            <textarea id="itemMemo" placeholder="メモ"></textarea>
            <button class="add-btn" id="addItemBtn">追加</button>
            <ul class="item-list" id="shoppingList"></ul>
        </section>

        <section id="stock" class="tab-content">
            <h2>在庫管理</h2>
            <input id="stockName" type="text" placeholder="アイテム名">
            <input id="stockQty" type="number" placeholder="数量" min="0" step="1">
            <textarea id="stockMemo" placeholder="メモ"></textarea>
            <button class="add-btn" id="addStockBtn">追加</button>
            <ul class="item-list" id="stockList"></ul>
        </section>

        <section id="store" class="tab-content">
            <div class="store-header">
                <h2>店舗メモ</h2>
                <button type="button" id="openStoreSearchBtn" class="store-search-btn">
                    🔍
                </button>
            </div>
            <input id="storeName" type="text" placeholder="店舗名">
            <input id="storeItem" type="text" placeholder="商品名">
            <input id="storePrice" type="text" placeholder="値段">
            <textarea id="storeMemo" placeholder="メモ"></textarea>
            <button class="add-btn" id="addStoreBtn">追加</button>
            <ul class="item-list" id="storeList"></ul>
        </section>

        <!-- アカウント・会員登録・ログイン -->
        <section id="account" class="tab-content">
            <h2>アカウント</h2>

            <h3>アカウント情報</h3>
            <p id="accountStatus">ログイン状態を確認しています...</p>
            <button class="add-btn" id="logoutBtn">ログアウト</button>

            <h3>ログイン</h3>
            <p>登録済みのメールアドレスとパスワードを入力してください</p>
            <input id="loginEmail" type="email" placeholder="メールアドレス" autocomplete="email">
            <input id="loginPassword" type="password" placeholder="パスワード(8文字以上)" autocomplete="current-password">
            <button class="add-btn" id="loginBtn">ログイン</button>

            <h3>新規会員登録</h3>
            <p>メールアドレスとパスワードを登録してください</p>
            <input id="registerEmail" type="email" placeholder="メールアドレス" autocomplete="email">
            <input id="registerPassword" type="password" placeholder="パスワード(8文字以上)" autocomplete="new-password">
            <input id="registerPasswordConfirm" type="password" placeholder="パスワード確認" autocomplete="new-password">
            <button class="add-btn" id="registerBtn">登録</button>
        </section>
    </main>

    <nav>
        <button class="active" onclick="showTab('shopping', this)">🛒 買い物</button>
        <button onclick="showTab('stock', this)">📦 在庫</button>
        <button onclick="showTab('store', this)">🏪 店舗</button>
        <button onclick="showTab('account', this)">👤 アカウント</button>
    </nav>

    <script type="module" src="GomaCart.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(() => console.log('Service Worker登録成功'))
                .catch(err => console.error('Service Worker登録失敗:', err));
        }
    </script>
</body>

</html>
